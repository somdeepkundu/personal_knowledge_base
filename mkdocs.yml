site_name: Somdeep's Notes
site_description: "Somdeep Kundu's personal notes on remote sensing, geospatial data and tools"
site_author: "Somdeep Kundu"
site_url: https://somdeepkundu.github.io/personal_knowledge_base/
repo_url: https://github.com/somdeepkundu/personal_knowledge_base
repo_name: somdeepkundu/personal_knowledge_base
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  # Matches somdeepkundu.github.io: Desert Rose (light) / Dark Rose Tech (dark).
  # Colours and fonts live in notes/assets/css/extra.css.
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: pink
      toggle:
        icon: material/brightness-3
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - hooks.py

extra_css:
  - assets/css/extra.css

copyright: "Copyright &copy; Somdeep Kundu"

extra:
  social:
    - icon: material/web
      link: https://somdeepkundu.github.io/
      name: Portfolio
    - icon: fontawesome/brands/github
      link: https://github.com/somdeepkundu
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/somdeep-kundu

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - exclude-search:
      exclude:
        - log.md
  - roamlinks

nav:
  - Home:
    - index.md
    - Embeddings: Embeddings.md
    - SQL: SQL.md
    - Python: Python.md
    - Data: Data.md
    - Climate Change: Climate_Change.md
    - Urban Planning: Urban_Planning.md
    - Agriculture: Agriculture.md
    - Remote Sensing: Remote_Sensing.md
    - Changelog: log.md
